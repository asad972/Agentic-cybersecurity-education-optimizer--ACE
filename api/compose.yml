# Run with: docker compose -f api/compose.yml up --build -d
services:
  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    ports:
      - "127.0.0.1:${ACE_API_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CASSANDRA_HOSTS: ${CASSANDRA_HOSTS:-host.docker.internal}
      CASSANDRA_PORT: ${CASSANDRA_PORT:-9042}
      CASSANDRA_KEYSPACE: ${CASSANDRA_KEYSPACE:-ace}
      CASSANDRA_LOCAL_DC: ${CASSANDRA_LOCAL_DC:-datacenter1}
      # Follows the dashboard's port, so a dashboard moved with ACE_DASHBOARD_PORT can still call the API.
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:${ACE_DASHBOARD_PORT:-5173},http://127.0.0.1:${ACE_DASHBOARD_PORT:-5173}}
      # WS /live only. See "Live alert feed" in api/README.md for the Docker network.
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      API_LIVE_ALERTS: ${API_LIVE_ALERTS:-true}
      API_LIVE_RETRY_SECONDS: ${API_LIVE_RETRY_SECONDS:-5}
