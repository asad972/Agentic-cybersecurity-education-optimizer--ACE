[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ace-api"
version = "0.1.0"
description = "ACE FastAPI service skeleton (M4, issue 33)"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "cassandra-driver>=3.29,<4"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
include = ["ace_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
