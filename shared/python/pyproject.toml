[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ace"
version = "0.1.0"
description = "Shared code for ACE: contracts, stream stages, and structured LLM access"
requires-python = ">=3.11,<3.13"
dependencies = [
    "jsonschema[format]==4.26.0",
]

[project.optional-dependencies]
# Stream stages run on Apache Flink (PyFlink). Agents and the sink only need the contracts.
stages = ["river==0.23.0"]
flink = ["apache-flink==2.3.0", "ace[stages]"]
llm = [
    "pydantic==2.14.1",
    "httpx==0.28.1",
    "anthropic==1.17.0",
    "cassandra-driver==3.30.1",
]
# Existing setup and CI install dev; collecting stage tests requires River.
dev = ["pytest==9.1.1", "ace[stages]"]

[tool.setuptools.packages.find]
include = ["ace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["flink: runs the stage on a local Flink (needs Java; about 30 s)"]
