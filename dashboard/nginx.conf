# Template: at start-up the nginx image fills in the API address (ACE_API_URL) and the DNS server.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Look the API host up when a request comes in, so the page still starts without an API.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=30s ipv6=off;
    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(js|css)$ { try_files $uri =404; }
    location ^~ /api/ {
        set $ace_api ${ACE_API_URL};
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $ace_api;
        proxy_set_header Host $proxy_host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
