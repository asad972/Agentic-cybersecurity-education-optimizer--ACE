apiVersion: v1
kind: ConfigMap
metadata:
  name: ace-gap-config
  labels:
    app.kubernetes.io/name: ace-skills-gap
    app.kubernetes.io/part-of: ace
data:
  GAP_MIN_SUPPLY: "20"
  GAP_SUPPLY_LOOKBACK_DAYS: "365"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ace-skills-gap
  labels:
    app.kubernetes.io/name: ace-skills-gap
    app.kubernetes.io/part-of: ace
spec:
  schedule: "0 3 1 * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ace-skills-gap
        spec:
          restartPolicy: Never
          containers:
            - name: skills-gap
              image: ace-skills-gap:latest
              imagePullPolicy: IfNotPresent
              envFrom:
                - configMapRef:
                    name: ace-gap-config
              env:
                - name: CASSANDRA_HOSTS
                  value: cassandra
                - name: CASSANDRA_PORT
                  value: "9042"
                - name: CASSANDRA_KEYSPACE
                  value: ace
                - name: CASSANDRA_LOCAL_DC
                  value: datacenter1
                - name: CASSANDRA_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: ace-cassandra-credentials
                      key: username
                      optional: true
                - name: CASSANDRA_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ace-cassandra-credentials
                      key: password
                      optional: true
              resources:
                requests:
                  cpu: 250m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
