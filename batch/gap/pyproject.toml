[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ace-skills-gap"
version = "0.1.0"
description = "ACE monthly Skills Gap and ECSF role-relations job"
requires-python = ">=3.11,<3.13"
dependencies = [
  "cassandra-driver==3.30.1",
  "Deprecated==1.3.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ace_gap*"]

[tool.pytest.ini_options]
markers = ["cassandra: requires a live Cassandra instance"]
