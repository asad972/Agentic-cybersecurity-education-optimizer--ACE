[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ace-demand-forecast"
version = "0.1.0"
description = "ACE monthly Skill Demand forecasting job"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.1.3",
  "pandas==3.1.1",
  "scipy==1.17.1",
  "statsmodels==0.15.0",
  "lightgbm==4.7.0",
  "cassandra-driver==3.30.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ace_forecast*"]

[tool.pytest.ini_options]
markers = ["cassandra: requires a live Cassandra instance"]
