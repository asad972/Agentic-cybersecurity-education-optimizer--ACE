name: Bug
description: Something runs but gives a wrong result, crashes or stops
labels: ["bug"]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: Service, stage or page, e.g. S4, sink, Europe map
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened and what I expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      description: Commands, input records or screenshots. Never paste API keys.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: shell
