name: API native Windows tests

on:
  push:
    branches: [master]
    paths:
      - 'api/**'
      - '.github/workflows/api-windows.yml'
  pull_request:
    paths:
      - 'api/**'
      - '.github/workflows/api-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Confirm native Windows interpreter
        run: python -c "import platform; print(platform.platform()); print(platform.python_version()); assert platform.system() == 'Windows'"
      - name: Install API and test dependencies
        run: python -m pip install -e "./api[dev]"
      - name: Run API regression tests
        run: python -m pytest -q -c api/pyproject.toml api/tests
