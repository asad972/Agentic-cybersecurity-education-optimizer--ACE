# Local development stack: single-node Kafka (KRaft), Kafka UI, Cassandra and the sink.
# The production layout (3 brokers, 3 Cassandra nodes) is in deploy/k8s/.

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: ace-kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-init:
    image: apache/kafka:3.8.0
    container_name: ace-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./deploy/kafka/create-topics.sh:/create-topics.sh:ro
      - ./shared/schemas/topics.csv:/topics.csv:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    environment:
      BOOTSTRAP: kafka:29092
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: ace-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ace-dev
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  cassandra:
    image: cassandra:4.1
    container_name: ace-cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: ace-dev
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20

  cassandra-init:
    image: cassandra:4.1
    container_name: ace-cassandra-init
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./storage/cql/schema.cql:/schema.cql:ro
    entrypoint: ["cqlsh", "cassandra", "-f", "/schema.cql"]
    restart: "no"

  sink:
    build:
      context: .
      dockerfile: storage/sink/Dockerfile
    container_name: ace-sink
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      cassandra-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CASSANDRA_HOSTS: cassandra
      CASSANDRA_KEYSPACE: ace
    restart: on-failure

  # Live threat collector (M4). It needs OTX_API_KEY and ABUSEIPDB_API_KEY in .env,
  # so it is in the "live" profile: add COMPOSE_PROFILES=live to .env to start it with
  # the rest. It polls both feeds every six hours and follows tasks.collect.
  threat-agent:
    build:
      context: .
      dockerfile: agents/threat/Dockerfile
    container_name: ace-threat-agent
    profiles: [live]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OTX_API_KEY: ${OTX_API_KEY:-}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
    volumes:
      - threat-state:/state
    restart: on-failure

  # Stream stages, each a Flink job on Kafka from the shared image in streaming/Dockerfile.
  # The consumer group is the stage name, so a restarted stage continues where it stopped.
  s7-threat-frequency-hourly:
    &stage
    build:
      context: .
      dockerfile: streaming/Dockerfile
    image: ace-stage
    container_name: ace-s7-hourly
    command: ["s7_threat_frequency.stage:ThreatFrequencyStage", "--arg", "period=hourly"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    restart: on-failure

  s7-threat-frequency-daily:
    <<: *stage
    container_name: ace-s7-daily
    command: ["s7_threat_frequency.stage:ThreatFrequencyStage", "--arg", "period=daily"]

  s8-threat-bursts:
    <<: *stage
    container_name: ace-s8
    command: ["s8_threat_bursts.stage:ThreatBurstStage"]

volumes:
  kafka-data:
  cassandra-data:
  threat-state:
