# A laptop cluster usually has no Ingress controller, so the web app and the
# API get fixed NodePorts instead.
apiVersion: v1
kind: Service
metadata:
  name: dashboard
spec:
  type: NodePort
  ports:
    - name: http
      port: 80
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: NodePort
  ports:
    - name: http
      port: 8000
      nodePort: 30800
