# The pipeline metrics exporter (deploy/monitoring/exporter): reads Kafka with
# its own consumer group and llm_cache in Cassandra; never writes to either.
# One replica only: a second one would share the topics with the first and
# each would count only part of the messages.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipeline-exporter
  labels:
    app.kubernetes.io/name: pipeline-exporter
    app.kubernetes.io/component: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pipeline-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pipeline-exporter
        app.kubernetes.io/component: monitoring
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: ace-pipeline-exporter
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: EXPORTER_GROUP_ID
              value: ace-monitoring
            - name: CASSANDRA_HOSTS
              value: cassandra
            - name: CASSANDRA_PORT
              value: "9042"
            - name: CASSANDRA_KEYSPACE
              value: ace
            - name: LLM_SPEND_INTERVAL_SECONDS
              value: "300"
            # Shown next to the spend; keep equal to the LLM module's setting.
            - name: LLM_DAILY_BUDGET_EUR
              value: "2"
          ports:
            - name: metrics
              containerPort: 9400
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: pipeline-exporter
  labels:
    app.kubernetes.io/name: pipeline-exporter
    app.kubernetes.io/component: monitoring
spec:
  selector:
    app.kubernetes.io/name: pipeline-exporter
  ports:
    - name: metrics
      port: 9400
      targetPort: metrics
