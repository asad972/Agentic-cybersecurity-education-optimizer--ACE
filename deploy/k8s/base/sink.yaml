# Sink: the only writer of stream data to Cassandra (storage/sink/).
# It has no HTTP port: on a Kafka or Cassandra error it stops without
# committing, and Kubernetes starts it again. sink-config switches topics on and off.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sink
  labels:
    app.kubernetes.io/name: sink
    app.kubernetes.io/component: sink
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sink
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sink
        app.kubernetes.io/component: sink
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: sink
          image: ace-sink           # built locally: docker build -t ace-sink -f storage/sink/Dockerfile .
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: ace-config
            - configMapRef:
                name: sink-config
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
