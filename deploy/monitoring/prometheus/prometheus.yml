# Prometheus for the local Docker Compose stack (deploy/monitoring/compose.yml).
# The Kubernetes version is deploy/k8s/monitoring/prometheus.yml; both load the
# same recording rules from rules/.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Records per source, duplicates, extraction, Unmapped Skills, invalid
  # messages, orchestrator tasks and LLM spend (deploy/monitoring/exporter).
  - job_name: pipeline-exporter
    static_configs:
      - targets: ["pipeline-exporter:9400"]

  # Kafka brokers, topic offsets and consumer lag per group (e.g. ace-sink).
  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]

  # Flink's Prometheus reporter (late records and job health). Shows as down
  # until a Flink cluster with these names runs on the same Docker network.
  - job_name: flink
    static_configs:
      - targets: ["flink-jobmanager:9249", "flink-taskmanager:9249"]
