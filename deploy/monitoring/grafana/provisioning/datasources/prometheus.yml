# The Prometheus data source. Same file on Docker Compose and Kubernetes:
# both run Prometheus under the name "prometheus".
apiVersion: 1

datasources:
  - name: Prometheus
    uid: ace-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
